<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Software engineering portfolio header</title>
  <desc id="description">A dark navy vector banner with the phrase Build. Verify. Refine. and an abstract connected-node engineering diagram.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1526"/>
      <stop offset="0.55" stop-color="#13263B"/>
      <stop offset="1" stop-color="#123D49"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7BE5CF"/>
      <stop offset="1" stop-color="#91B9FF"/>
    </linearGradient>
    <radialGradient id="flare">
      <stop offset="0" stop-color="#73D9DF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#73D9DF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#B4C9DD" stroke-width="0.8" stroke-opacity="0.11"/>
    </pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="1198" height="278" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="280" fill="url(#surface)"/>
    <rect x="500" width="700" height="280" fill="url(#grid)"/>
    <circle cx="1056" cy="144" r="253" fill="url(#flare)"/>
    <path d="M930 0L1199 244M1105 0L1200 87M808 0L1084 280" fill="none" stroke="#9EBEDB" stroke-width="1" stroke-opacity="0.13"/>
    <rect x="0" y="0" width="1200" height="280" rx="22" fill="none" stroke="#A6C9E6" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M65 67H93M65 67V89" fill="none" stroke="#7BE5CF" stroke-width="3" stroke-linecap="round"/>
    <text x="112" y="75" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700" font-size="24" letter-spacing="4.2" fill="#A2DDE0">SOFTWARE ENGINEERING</text>
    <text x="66" y="176" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="760" font-size="75" letter-spacing="-2.5" fill="#F4F8FF">Build. Verify. Refine.</text>
    <rect x="67" y="198" width="78" height="4" rx="2" fill="#80E4CE"/>
    <text x="163" y="211" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="500" font-size="24" fill="#C4D7E9">Systems  /  Interfaces  /  Automation</text>
    <g transform="translate(1004,130)" fill="none" stroke="url(#line)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-20 -56L52 -90L124 -48L123 38L53 83L-22 41Z" stroke-width="2" opacity="0.8"/>
      <path d="M-20 -56L53 -8L124 -48M53 -8L53 83M-22 41L53 -8L123 38" stroke-width="1.5" opacity="0.68"/>
      <circle cx="-20" cy="-56" r="7" fill="#15263C" stroke-width="3"/>
      <circle cx="52" cy="-90" r="7" fill="#15263C" stroke-width="3"/>
      <circle cx="124" cy="-48" r="7" fill="#15263C" stroke-width="3"/>
      <circle cx="53" cy="-8" r="11" fill="#80E4CE" stroke="#80E4CE" stroke-width="2"/>
      <circle cx="123" cy="38" r="7" fill="#15263C" stroke-width="3"/>
      <circle cx="53" cy="83" r="7" fill="#15263C" stroke-width="3"/>
      <circle cx="-22" cy="41" r="7" fill="#15263C" stroke-width="3"/>
    </g>
  </g>
</svg>
